<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>词域远征 · 尖塔背单词</title>
<link rel="stylesheet" href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.css">
<style>
:root{
  --bg:#f4f2ec;
  --card:#ffffff;
  --card2:#faf8f3;
  --line:#e9e4d8;
  --ink:#3a362e;
  --sub:#9a9488;
  --accent:#4a6b5a;
  --atk:#c0392b;
  --def:#2980b9;
  --gold:#a9823d;
  --green:#5f8a70;
  --red:#b8534a;
}
:root[data-theme="pink"]{
  --bg:#fff0f5; --card:#fff7fa; --card2:#ffe9f0; --line:#ffd9e4;
  --ink:#7a4358; --sub:#c98da3; --accent:#e87aa0;
  --atk:#f06292; --def:#9c6bd6; --gold:#f9a825; --green:#66bb6a; --red:#ef5350;
}
:root[data-theme="pink"] .panel{border-radius:20px;}
:root[data-theme="pink"] .chip{border-radius:15px;}
:root[data-theme="pink"] .btn{border-radius:16px;}
:root[data-theme="pink"] .actionCard{border-radius:18px;}
:root[data-theme="pink"] #topbar{border-radius:18px;}
:root[data-theme="pink"] #enemyArea{border-radius:18px;}
:root[data-theme="pink"] #qArea{border-radius:18px;}
:root[data-theme="pink"] #playerArea{border-radius:18px;}
:root[data-theme="pink"] #log{border-radius:18px;}
:root[data-theme="pink"] h1.title{letter-spacing:2px;}
:root[data-theme="pink"] body{background:var(--bg);}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:16px 12px 44px;}
#app{width:100%;max-width:500px;}
.screen{display:none;}
.screen.active{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}25%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-52px)}}

h1.title{font-size:36px;font-weight:800;text-align:center;letter-spacing:2px;color:var(--accent);}
.sub{color:var(--sub);text-align:center;font-size:13px;margin-top:6px;}
.logo{text-align:center;margin:22px 0 8px;}
.logo .glyph{font-size:44px;color:var(--accent);display:inline-block;}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:18px;margin-bottom:12px;animation:fadeUp .3s;}
.panel h3{font-size:12px;color:var(--sub);font-weight:700;letter-spacing:1px;margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--line);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{flex:1;min-width:82px;text-align:center;padding:10px 6px;border:1px solid var(--line);border-radius:9px;background:var(--card2);color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;transition:all .12s;}
.chip:active{transform:scale(.97);}
.chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
.chip .d{display:block;font-size:10px;font-weight:400;margin-top:2px;color:var(--sub);}
.chip.selected .d{color:rgba(255,255,255,.75);}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:all .12s;margin-bottom:10px;text-align:center;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.gold{background:var(--gold);}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
.btn.ghost:active{background:var(--card2);}
.home-hero{padding:4px 0 6px;}

#topbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:11px 14px;margin-bottom:10px;}
.stat{text-align:center;min-width:50px;}
.stat .v{font-size:17px;font-weight:800;color:var(--ink);}
.stat .l{font-size:9px;color:var(--sub);letter-spacing:1px;font-weight:600;}
.hpbar{width:50px;height:6px;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:4px auto 0;}
.hpbar i{display:block;height:100%;background:var(--red);transition:width .3s;}

#playerArea{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-around;align-items:center;}
.pstat{text-align:center;}
.pstat .lbl{font-size:9px;color:var(--sub);font-weight:700;letter-spacing:1px;}
.pstat .num{font-size:24px;font-weight:800;line-height:1.15;color:var(--ink);}
.pstat .ico{font-size:20px;color:var(--sub);}

#enemyArea{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:16px;margin-bottom:10px;text-align:center;}
#floorTag{display:block;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px;margin-bottom:10px;}
#enemyRow{display:flex;align-items:center;justify-content:center;gap:16px;}
#enemyIcon{font-size:44px;color:var(--accent);line-height:1;}
#enemyMeta{text-align:left;}
#enemyName{font-size:17px;font-weight:800;color:var(--ink);}
#enemyHpWrap{margin-top:5px;}
#enemyHp{height:8px;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden;width:140px;}
#enemyHp i{display:block;height:100%;background:var(--atk);transition:width .3s;}
#enemyHpTxt{font-size:11px;color:var(--sub);font-weight:600;margin-top:3px;}
#enemyBlock{display:none;align-items:center;justify-content:center;gap:5px;margin-top:7px;font-weight:700;color:var(--def);font-size:13px;}
#intentBox{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;color:var(--sub);}
#intentIco{font-size:22px;color:var(--accent);}
#intentLabel{font-size:13px;font-weight:700;color:var(--ink);}
#intentNum{font-size:15px;font-weight:800;}

#qArea{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:18px;margin-bottom:10px;position:relative;text-align:center;}
#choiceBanner{display:inline-block;padding:3px 13px;border-radius:99px;font-weight:700;font-size:11px;margin-bottom:10px;letter-spacing:1px;}
#choiceBanner.atk{background:var(--atk);color:#fff;}
#choiceBanner.def{background:var(--def);color:#fff;}
#qType{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px;}
#qWord{font-size:29px;font-weight:800;margin:9px 0 2px;word-break:break-word;color:var(--ink);}
#qPos{font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;}
#qHint{font-size:12px;color:var(--sub);margin:6px 0 15px;}
#timerRing{position:absolute;top:12px;right:14px;width:36px;height:36px;border:1px solid var(--line);border-radius:50%;line-height:34px;font-weight:800;font-size:14px;text-align:center;color:var(--accent);background:var(--card2);}
#options{display:grid;gap:9px;margin-top:4px;}
.opt{padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card2);font-size:15px;cursor:pointer;text-align:left;font-weight:600;color:var(--ink);transition:all .1s;}
.opt:active{transform:scale(.98);}
.opt:hover{border-color:var(--accent);}
.opt .letter{display:inline-block;width:21px;height:21px;line-height:21px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:5px;font-size:11px;margin-right:9px;font-weight:700;color:var(--sub);}
.opt.correct{background:#eef4f0;border-color:var(--green);color:var(--green);}
.opt.correct .letter{background:var(--green);color:#fff;border-color:var(--green);}
.opt.wrong{background:#f8edeb;border-color:var(--red);color:var(--red);animation:shakeX .4s;}
.opt.wrong .letter{background:var(--red);color:#fff;border-color:var(--red);}
.opt:disabled{cursor:not-allowed;}
#feedback{text-align:center;font-size:13px;margin-top:11px;font-weight:700;min-height:18px;}
#feedback.ok{color:var(--green);}
#feedback.bad{color:var(--red);}

#actionBar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.actionCard{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.04);padding:14px 10px;text-align:center;cursor:pointer;transition:all .12s;}
.actionCard:active{transform:scale(.97);}
.actionCard.atk{background:var(--atk);border-color:var(--atk);}.actionCard.atk:hover{filter:brightness(1.05);}
.actionCard.def{background:var(--def);border-color:var(--def);}.actionCard.def:hover{filter:brightness(1.05);}
.actionCard .ico{font-size:30px;line-height:1;}
.actionCard.atk .ico{color:#fff;}
.actionCard.def .ico{color:#fff;}
.actionCard .nm{font-size:16px;font-weight:800;margin-top:5px;color:#fff;}
.actionCard .ds{font-size:10px;font-weight:600;color:rgba(255,255,255,.85);margin-top:2px;}
.actionCard .rate{font-size:10px;font-weight:700;color:#fff;margin-top:6px;display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 9px;}

#toolbar{padding:14px;margin-bottom:10px;}
#toolbar h3{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:9px;letter-spacing:1px;border-bottom:1px solid var(--line);padding-bottom:6px;}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tool{padding:8px 3px;border:1px solid var(--line);border-radius:9px;background:var(--card2);cursor:pointer;text-align:center;font-size:10px;font-weight:700;color:var(--ink);}
.tool .ico{display:block;font-size:19px;margin-bottom:2px;color:var(--accent);}
.tool:disabled{opacity:.4;cursor:not-allowed;}
#log{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;max-height:74px;overflow-y:auto;font-size:11.5px;color:var(--sub);font-weight:600;}
#log div{margin:2px 0;}
#log .g{color:var(--green);}#log .r{color:var(--red);}#log .y{color:var(--gold);}#log .b{color:var(--def);}

#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:50;}
.fx{position:absolute;font-weight:800;font-size:22px;color:var(--atk);animation:floatUp 1s ease-out forwards;}
.fx.heal{color:var(--green);}
.fx.def{color:var(--def);}
.fx.gold{color:var(--gold);}

#overlay{position:fixed;inset:0;background:rgba(58,54,46,.4);z-index:80;display:none;align-items:center;justify-content:center;padding:20px;}
#overlay.show{display:flex;}
.overlay-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.1);padding:20px;animation:pop .3s;}
.oc-title{text-align:center;font-size:17px;font-weight:800;margin-bottom:4px;color:var(--ink);}
.oc-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px;font-weight:600;}
.relics{display:grid;gap:9px;}
.relic{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--card2);cursor:pointer;transition:all .12s;text-align:left;}
.relic:hover{border-color:var(--accent);background:var(--card);}
.relic:active{transform:scale(.98);}
.relic .r-name{font-weight:800;font-size:14px;color:var(--ink);}
.relic .r-desc{font-size:12px;color:var(--sub);margin-top:3px;font-weight:600;}

#resultStats{font-size:14px;font-weight:600;}
.stat-row{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px solid var(--line);}
.stat-row span:last-child{font-weight:800;color:var(--accent);}
.big-result{font-size:23px;font-weight:800;text-align:center;margin:8px 0 12px;color:var(--ink);}
.upgrade-list{display:grid;gap:9px;}
.upgrade{border:1px solid var(--line);border-radius:9px;padding:11px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.upgrade:disabled{opacity:.4;cursor:not-allowed;}
.upgrade .u-name{font-weight:800;font-size:13px;}
.upgrade .u-desc{font-size:10px;color:var(--sub);margin-top:2px;}
.upgrade .u-cost{color:var(--gold);font-weight:800;}

.toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-weight:700;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:86%;text-align:center;}
.hidden{display:none!important;}

</style>
</head>
<body>
<div id="fxLayer"></div>
<div id="app">

  <!-- 主菜单 -->
  <div id="screen-start" class="screen active">
    <div class="home-hero">
      <div class="logo"><span class="glyph" data-lucide="scroll"></span></div>
      <h1 class="title">词域远征</h1>
      <p class="sub">答对=出手 · 答错=落空 · 读懂敌人意图</p>
    </div>
    <div class="panel"><h3>词库</h3><div class="chips" id="tierChips"></div></div>
    <div class="panel"><h3>角色</h3><div class="chips" id="heroChips"></div></div>
    <div class="panel"><h3>难度</h3><div class="chips" id="diffChips"></div></div>
    <div class="panel"><h3>主题</h3><div class="chips" id="themeChips"><div class="chip selected" data-theme="minimal">极简线条</div><div class="chip" data-theme="pink">粉红可爱</div></div></div>
    <button class="btn gold" id="btnStart">开始远征</button>
    <button class="btn ghost" id="btnMeta">局外成长</button>
  </div>

  <!-- 战斗 -->
  <div id="screen-game" class="screen">
    <div id="topbar">
      <div class="stat"><div class="v" id="statFloor">Lv.1</div><div class="l">层数</div></div>
      <div class="stat"><div class="v" id="statHp">60</div><div class="hpbar"><i id="statHpBar"></i></div><div class="l">生命</div></div>
      <div class="stat"><div class="v" id="statGold">0</div><div class="l">金币</div></div>
      <div class="stat"><div class="v" id="combo">×0</div><div class="l">连击</div></div>
    </div>

    <div id="enemyArea">
      <span id="floorTag">第 1 层</span>
      <div id="enemyRow">
        <span id="enemyIcon" data-lucide="ghost"></span>
        <div id="enemyMeta">
          <div id="enemyName">史莱姆</div>
          <div id="enemyHpWrap"><div id="enemyHp"><i id="enemyHpFill"></i></div><div id="enemyHpTxt">30/30</div></div>
          <div id="enemyBlock"><span data-lucide="shield"></span><span id="enemyBlockNum">0</span></div>
        </div>
      </div>
      <div id="intentBox">
        <span id="intentIco" data-lucide="sword"></span>
        <span id="intentLabel">攻击</span>
        <span id="intentNum">8</span>
      </div>
    </div>

    <div id="playerArea">
      <div class="pstat"><div class="lbl">生命</div><div class="num" id="pHp">60</div></div>
      <div class="pstat"><div class="ico" data-lucide="shield"></div><div class="num" id="pBlock">0</div><div class="lbl">格挡</div></div>
      <div class="pstat"><div class="ico" data-lucide="swords"></div><div class="num" id="pAtk">0</div><div class="lbl">本击</div></div>
    </div>

    <div id="actionBar">
      <div class="actionCard atk" id="btnAtk"><div class="ico" data-lucide="sword"></div><div class="nm">攻击</div><div class="ds">答对造成伤害</div><div class="rate" id="atkRate">0/秒</div></div>
      <div class="actionCard def" id="btnDef"><div class="ico" data-lucide="shield"></div><div class="nm">防御</div><div class="ds">答对获得格挡</div><div class="rate" id="defRate">0/秒</div></div>
    </div>

    <div id="qArea">
      <span id="qType">英→中</span>
      <span id="timerRing">15</span>
      <div id="choiceBanner" class="atk">攻击</div>
      <div id="qWord">abandon</div>
      <div id="qPos">v.</div>
      <div id="qHint">选择正确释义</div>
      <div id="options"></div>
      <div id="feedback"></div>
    </div>

    <div id="toolbar" class="panel"><h3>道具</h3><div id="tools"></div></div>
    <div id="log" class="panel"></div>
  </div>

  <!-- 结算 -->
  <div id="screen-result" class="screen">
    <div class="panel" style="margin-top:24px;">
      <div class="logo"><span class="glyph" id="resultGlyph" data-lucide="skull"></span></div>
      <div class="big-result" id="resultTitle">远征失败</div>
      <div id="resultStats"></div>
      <button class="btn gold" id="btnAgain" style="margin-top:14px;">再次远征</button>
      <button class="btn ghost" id="btnHome">返回主页</button>
    </div>
  </div>

  <!-- 成长 -->
  <div id="screen-meta" class="screen">
    <div class="panel" style="margin-top:20px;">
      <h3 style="text-align:center;font-size:17px;">局外成长</h3>
      <div style="text-align:center;color:var(--gold);font-size:20px;font-weight:900;margin:8px 0;" id="metaStar">星尘: 0</div>
      <div class="upgrade-list" id="upgradeList"></div>
      <button class="btn ghost" id="btnMetaBack">返回</button>
    </div>
  </div>
</div>

<div id="overlay"><div class="overlay-card"><div class="oc-title">遗物</div><div class="oc-sub">三选一强化本局</div><div class="relics" id="relicChoices"></div></div></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>
/* ============ KET 词库 ============ */
const TIERS={ket:{name:"KET",words:[
  {en:"able",cn:"能够的",pos:"adj."},{en:"about",cn:"关于；大约",pos:"prep./adv."},{en:"above",cn:"在……上面",pos:"prep."},
  {en:"across",cn:"穿过",pos:"prep."},{en:"afraid",cn:"害怕的",pos:"adj."},{en:"after",cn:"在……之后",pos:"prep./conj."},
  {en:"again",cn:"再一次",pos:"adv."},{en:"agree",cn:"同意",pos:"v."},{en:"airport",cn:"机场",pos:"n."},
  {en:"always",cn:"总是",pos:"adv."},{en:"answer",cn:"回答；答案",pos:"v./n."},{en:"arrive",cn:"到达",pos:"v."},
  {en:"ask",cn:"问；请求",pos:"v."},{en:"back",cn:"后面；返回",pos:"adv./n."},{en:"bad",cn:"坏的",pos:"adj."},
  {en:"bag",cn:"包；袋子",pos:"n."},{en:"bank",cn:"银行",pos:"n."},{en:"beautiful",cn:"美丽的",pos:"adj."},
  {en:"because",cn:"因为",pos:"conj."},{en:"become",cn:"变成",pos:"v."},{en:"before",cn:"在……之前",pos:"prep./conj."},
  {en:"begin",cn:"开始",pos:"v."},{en:"behind",cn:"在……后面",pos:"prep."},{en:"believe",cn:"相信",pos:"v."},
  {en:"between",cn:"在……之间",pos:"prep."},{en:"big",cn:"大的",pos:"adj."},{en:"bike",cn:"自行车",pos:"n."},
  {en:"boring",cn:"无聊的",pos:"adj."},{en:"borrow",cn:"借入",pos:"v."},{en:"both",cn:"两者都",pos:"det./pron."},
  {en:"break",cn:"打破；休息",pos:"v./n."},{en:"breakfast",cn:"早餐",pos:"n."},{en:"bring",cn:"带来",pos:"v."},
  {en:"build",cn:"建造",pos:"v."},{en:"busy",cn:"忙碌的",pos:"adj."},{en:"buy",cn:"买",pos:"v."},
  {en:"call",cn:"打电话；称呼",pos:"v."},{en:"carry",cn:"携带",pos:"v."},{en:"catch",cn:"抓住",pos:"v."},
  {en:"change",cn:"改变；零钱",pos:"v./n."},{en:"cheap",cn:"便宜的",pos:"adj."},{en:"choose",cn:"选择",pos:"v."},
  {en:"classroom",cn:"教室",pos:"n."},{en:"clean",cn:"干净的；打扫",pos:"adj./v."},{en:"clever",cn:"聪明的",pos:"adj."},
  {en:"climb",cn:"爬",pos:"v."},{en:"close",cn:"关闭；近的",pos:"v./adj."},{en:"cloudy",cn:"多云的",pos:"adj."},
  {en:"coat",cn:"外套",pos:"n."},{en:"cold",cn:"冷的；感冒",pos:"adj./n."},{en:"college",cn:"大学；学院",pos:"n."},
  {en:"come",cn:"来",pos:"v."},{en:"cook",cn:"做饭；厨师",pos:"v./n."},{en:"country",cn:"国家；乡村",pos:"n."},
  {en:"course",cn:"课程；路线",pos:"n."},{en:"customer",cn:"顾客",pos:"n."},{en:"cut",cn:"切；割",pos:"v."},

function loadMeta(){try{const m=JSON.parse(localStorage.getItem(META_KEY));if(m&&typeof m==='object'){m.star=+m.star||0;m.maxHp=+m.maxHp||0;m.slot=+m.slot||0;m.goldStart=+m.goldStart||0;return m;}}catch(e){}return {star:0,maxHp:0,slot:0,goldStart:0};}

let S={};
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg){let t=$('toastBox');if(!t){t=document.createElement('div');t.className='toast';t.id='toastBox';document.body.appendChild(t);}t.textContent=msg;t.style.opacity=1;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.style.display='none',300);},1300);}
function log(msg,cls=''){const d=$('log');const div=document.createElement('div');div.className=cls;div.textContent=msg;d.prepend(div);while(d.children.length>9)d.removeChild(d.lastChild);}
function fx(x,y,txt,cls=''){const el=document.createElement('div');el.className='fx '+cls;el.textContent=txt;el.style.left=x+'px';el.style.top=y+'px';$('fxLayer').appendChild(el);setTimeout(()=>el.remove(),1000);}
function rect(id){const r=$(id).getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/3};}
function refreshIcons(){if(window.lucide)lucide.createIcons();}

/* ============ 词库 ============ */
function getPool(){
  const pool=[...TIERS.ket.words];
  const wrong=pool.filter(w=>S.wrongWords[w.en]);
  const base=shuffle(pool).slice(0,15);
  for(const w of wrong){if(Math.random()<.6&&!base.some(x=>x.en===w.en))base.push(w);}
  return base;
}
function buildOptions(target,pool,qType){
  const dist=[...TIERS.ket.words].filter(x=>x.en!==target.en);
  const opts=[];const used=shuffle(dist);
  if(qType==='e2c'){
    const p=[];for(const c of used){if(!p.includes(c.cn)&&c.cn!==target.cn){p.push(c.cn);if(p.length>=3)break;}}
    while(p.length<3)p.push('其他释义');
    return shuffle([target.cn,...p]);
  }else{
    const p=[];for(const c of used){if(!p.includes(c.en)){p.push(c.en);if(p.length>=3)break;}}
    while(p.length<3)p.push('anotherword');
    return shuffle([target.en,...p]);
  }
}

/* ============ 回合 ============ */
function startTurn(){
  S.block=0; // 玩家格挡清零（新回合开始）
  updatePlayer();
  // 生成敌人意图
  const pool=S.enemy.intents;
  const roll=Math.random();
  const it=pool[Math.floor(Math.random()*pool.length)];
  S.intent={type:it[0],val:it[1]};
  if(S.intent.type===2)S.intent.val=1+Math.floor(Math.random()*3); // 蓄力层数
  renderIntent();
  renderEnemy();
  S.phase='choose';
  $('actionBar').style.display='grid';
  $('qArea').style.display='none';
  log('—— 第 '+(S.turnCount+1)+' 回合 —— 敌人准备「'+INTENT_LABEL[S.intent.type]+'」','y');
}
function choose(mode){
  if(S.phase!=='choose')return;
  S.choice=mode;S.phase='question';
  $('actionBar').style.display='none';
  $('qArea').style.display='block';
  const banner=$('choiceBanner');
  banner.className=mode==='atk'?'atk':'def';
  banner.textContent=mode==='atk'?'⚔ 攻击':'🛡 防御';
  nextQuestion();
}
function renderIntent(){
  $('intentIco').setAttribute('data-lucide',INTENT_ICON[S.intent.type]);
  $('intentLabel').textContent=INTENT_LABEL[S.intent.type];
  const num=S.intent.type===2?('×'+S.intent.val):S.intent.val;
  $('intentNum').textContent=S.intent.type===2?'(下次 ×'+(1+S.intent.val)+')':(''+num);
  $('intentNum').style.color=S.intent.type===0?'var(--atk)':(S.intent.type===1?'var(--def)':'var(--gold)');
  refreshIcons();
}
function nextQuestion(){
  const pool=getPool();if(pool.length<4)return;
  let w=pool[Math.floor(Math.random()*pool.length)];
  if(pool.length>1){while(w.en===S.lastWord){w=pool[Math.floor(Math.random()*pool.length)];}}
  S.lastWord=w.en;S.currentWord=w;
  const qType=Math.random()<.5?'e2c':'c2e';
  S.qType=qType;S.options=buildOptions(w,pool,qType);
  $('qType').textContent=qType==='e2c'?'英→中':'中→英';
  $('qPos').textContent=w.pos;
  $('qHint').textContent=qType==='e2c'?('选择「'+w.en+'」的释义'):('选择「'+w.cn+'」对应的单词');
  $('qWord').textContent=qType==='e2c'?w.en:w.cn;
  const box=$('options');box.innerHTML='';const letters=['A','B','C','D'];
  S.options.forEach((o,i)=>{const b=document.createElement('div');b.className='opt';b.innerHTML='<span class="letter">'+letters[i]+'</span>'+o;b.onclick=()=>answer(i,b);box.appendChild(b);});
  $('feedback').textContent='';$('feedback').className='';
  startTimer();
}
function startTimer(){
  const time=(S.diff.time||15)+(HEROES[S.hero].time||0);let remain=time;
  const ring=$('timerRing');ring.textContent=remain;ring.style.background='var(--card)';
  clearInterval(S.timer);
  S.timer=setInterval(()=>{remain--;ring.textContent=remain;if(remain<=5)ring.style.background='var(--red)';ring.style.color='#fff';if(remain<=0){clearInterval(S.timer);onTimeout();}},1000);
}
function lockOptions(){[...document.querySelectorAll('.opt')].forEach(b=>b.disabled=true);clearInterval(S.timer);}

/* ============ 答题结算 ============ */
function answer(i,el){
  if(S.phase!=='question'||S.locked)return;
  S.locked=true;lockOptions();
  const target=S.qType==='e2c'?S.currentWord.cn:S.currentWord.en;
  const btns=[...document.querySelectorAll('.opt')];
  const rightBtn=btns[S.options.indexOf(target)];
  const isRight=S.options[i]===target;
  if(isRight){if(rightBtn)rightBtn.classList.add('correct');resolve(true);}
  else{el.classList.add('wrong');if(rightBtn)rightBtn.classList.add('correct');resolve(false);}
}
function onTimeout(){if(S.phase!=='question')return;lockOptions();const target=S.qType==='e2c'?S.currentWord.cn:S.currentWord.en;const rb=[...document.querySelectorAll('.opt')][S.options.indexOf(target)];if(rb)rb.classList.add('correct');$('feedback').textContent='⏰ 超时！正确：'+target;$('feedback').className='bad';recordWrong();resolve(false,true);}
function resolve(correct,timeout){
  S.locked=true;
  const curTime=$('timerRing');const remain=Math.max(0,parseInt(curTime.textContent)||0);
  S.answeredThisTurn=remain;
  // 数值 = 剩余时间 × 系数
  let val=correct?Math.round(remain*(S.choice==='atk'?ATK_RATE*S.atkMul:DEF_RATE)):0;
  if(S.choice==='atk'){
    if(correct){S.enemy.hp-=Math.max(val-S.enemy.block,0);const absorbed=Math.min(val,S.enemy.block);S.enemy.block-=absorbed;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);}
    else{S.combo=0;}
    const p=rect('enemyArea');if(val>0)fx(p.x,p.y,'-'+val,'');else if(!correct)fx(p.x,p.y,'落空','heal');
    log((correct?('⚔ 攻击 '+val):'✗ 落空')+(timeout?'（超时）':''),correct?'':'r');
  }else{
    if(correct){S.block+=val;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);}
    else{S.combo=0;}
    if(val>0)fx(rect('playerArea').x,rect('playerArea').y,'+'+val,'def');
    log((correct?('🛡 格挡 '+val):'✗ 防御失败')+(timeout?'（超时）':''),correct?'':'r');
  }
  updatePlayer();updateEnemy();updateTop();
  $('feedback').textContent=correct?('✓ 正确 · '+(S.choice==='atk'?'伤害':'格挡')+' '+val):('✗ 答错，数值 0');
  $('feedback').className=correct?'ok':'bad';
  setTimeout(()=>{
    // ★ 玩家先手，攻击打死敌人则敌人不再行动，直接击杀
    if(S.enemy.hp<=0){onKill();return;}
    enemyTurn();
  },800);
}
function enemyTurn(){
  S.phase='enemy';
  const it=S.intent;
  if(it.type===0){ // 攻击
    const dmg=it.val*(S.enemyBuff?S.enemyBuff:1);
    S.enemyBuff=0;
    const absorbed=Math.min(dmg,S.block);const real=dmg-absorbed;
    S.block-=absorbed;S.hp-=real;
    log('👹 敌人攻击 '+dmg+'（格挡抵 '+absorbed+'，掉 '+real+' 血）',real>0?'r':'g');
    const p=rect('playerArea');if(real>0)fx(p.x,p.y,'-'+real,'');
  }else if(it.type===1){ // 防御
    S.enemy.block+=it.val;log('👹 敌人防御 +'+it.val,'b');
  }else{ // 蓄力
    S.enemyBuff=(S.enemyBuff||1)+it.val;log('👹 敌人蓄力，下次攻击 ×'+(S.enemyBuff),'y');
  }
  updatePlayer();updateEnemy();
  // 判定
  if(S.hp<=0){setTimeout(()=>endRun(false),700);return;}
  if(S.enemy.hp<=0){setTimeout(()=>onKill(),700);return;}
  // 新回合
  setTimeout(()=>{S.turnCount++;S.locked=false;startTurn();},900);
}

/* ============ 击杀/层 ============ */
function onKill(){
  S.killedTotal++;S.gold+=(S.enemy.goldGain||0);
  S.enemiesInFloor--;S.combo=0;
  if(S.enemy.isBoss){S.bossIndex=(S.bossIndex||0)+1;}
  toast('🎉 击败「'+S.enemy.name+'」');
  updateTop();
  setTimeout(()=>{
    if(S.enemiesInFloor<=0){floorClear();}
    else{spawnNextEnemy();}
  },600);
}
function floorClear(){
  log('✅ 本层敌人清空！','g');
  if(HEROES[S.hero].heal){S.hp=Math.min(S.maxHp,S.hp+HEROES[S.hero].heal);updatePlayer();}
  if(S.floor%5===0&&S.bossIndex>=BOSSES.length){endRun(true);return;}
  if(S.floor%5===0){S.floor++;spawnFloor();return;}
  giveRelic();
}
function giveRelic(){
  S.phase='relic';
  const box=$('relicChoices');box.innerHTML='';
  const choices=shuffle(RELICS).slice(0,3);
  choices.forEach(r=>{const d=document.createElement('div');d.className='relic';d.innerHTML='<div class="r-name">'+r.name+'</div><div class="r-desc">'+r.desc+'</div>';d.onclick=()=>{r.apply();toast('获得 '+r.name);$('overlay').classList.remove('show');S.floor++;spawnFloor();};box.appendChild(d);});
  $('overlay').classList.add('show');
}
const RELICS=[
  {name:'锋利之刃',desc:'攻击系数 +20%',apply:()=>{S.atkMul=(S.atkMul||1)*1.2;}},
  {name:'坚固之盾',desc:'防御系数 +20%',apply:()=>{S.defMul=(S.defMul||1)*1.2;}},
  {name:'聚宝盆',desc:'金币 +50%',apply:()=>{S.goldMul=(S.goldMul||1)*1.5;}},
  {name:'生命之石',desc:'最大生命 +15 并回 15',apply:()=>{S.maxHp+=15;S.hp=Math.min(S.maxHp,S.hp+15);updatePlayer();}},
  {name:'蓄力预知',desc:'看到敌人蓄力时，下次攻击翻倍',apply:()=>{S.knowBuff=true;}},
  {name:'时间之沙',desc:'答题时间 +3 秒',apply:()=>{S.timeBonus=(S.timeBonus||0)+3;}},
  {name:'荆棘',desc:'敌人攻击你时反弹 4 伤害',apply:()=>{S.thorn=true;}},
  {name:'连击之心',desc:'连击每 3 次额外 +2 金币',apply:()=>{S.comboGold=true;}}
];
function spawnFloor(){
  S.turnCount=0;S.locked=false;S.enemyBuff=0;
  if(S.floor%5===0){spawnBoss();return;}
  S.enemiesInFloor=1+Math.floor(Math.random()*2)+(S.floor>3?1:0);
  spawnNextEnemy();
}
function generateEnemy(){
  const idx=Math.floor(Math.random()*Math.min(ENEMIES.length,5+Math.floor(S.floor/3)));
  const e=ENEMIES[Math.min(idx,ENEMIES.length-1)];
  const hpMul=(S.diff.hpMul||2)*(1+S.floor*0.08);
  const hp=Math.round(e.hp*hpMul);
  return {name:e.name,icon:e.icon,hp,hpMax:hp,block:0,intents:e.intents,isBoss:false,goldGain:Math.round((10+S.floor)*1.2)};
}
function spawnNextEnemy(){
  S.enemy=generateEnemy();
  renderEnemy();updateEnemy();
  startTurn();
}
function spawnBoss(){
  const b=BOSSES[Math.min(S.bossIndex||0,BOSSES.length-1)];
  const hpMul=1+(S.floor/5-1)*0.35;
  S.enemy={name:b.name,icon:b.icon,hp:Math.round(b.hp*hpMul),hpMax:Math.round(b.hp*hpMul),block:0,intents:b.intents,isBoss:true,goldGain:60+S.floor*3};
  S.enemiesInFloor=1;$('floorTag').textContent='☠ BOSS · 第 '+S.floor+' 层';
  renderEnemy();updateEnemy();
  toast('👹 BOSS '+S.enemy.name+' 现身！');
  startTurn();
}

/* ============ 渲染 ============ */
function renderEnemy(){
  $('enemyIcon').setAttribute('data-lucide',S.enemy.icon);
  $('enemyName').textContent=S.enemy.name;
  refreshIcons();
  updateEnemy();
}
function updateEnemy(){
  const pct=Math.max(0,S.enemy.hp/S.enemy.hpMax*100);
  $('enemyHpFill').style.width=pct+'%';
  $('enemyHpTxt').textContent=Math.max(0,S.enemy.hp)+'/'+S.enemy.hpMax;
  if(S.enemy.block>0){$('enemyBlock').style.display='flex';$('enemyBlockNum').textContent=S.enemy.block;}
  else{$('enemyBlock').style.display='none';}
}
function updatePlayer(){
  $('pHp').textContent=Math.max(0,S.hp);
  $('pBlock').textContent=S.block||0;
  $('pAtk').textContent=S.choice==='atk'?('?'):'';
  $('statHp').textContent=Math.max(0,S.hp);
  $('statHpBar').style.width=(S.hp/S.maxHp*100)+'%';
  refreshIcons();
}
function updateTop(){
  $('statFloor').textContent='Lv.'+S.floor;
  $('statGold').textContent=S.gold;
  $('combo').textContent='×'+S.combo;
}

/* ============ 开局/结算 ============ */
function startRun(){
  Object.assign(S,{
    floor:1,gold:META.goldStart||0,combo:0,maxCombo:0,hp:0,maxHp:0,
    correctTotal:0,wrongTotal:0,killedTotal:0,atkMul:1,defMul:1,goldMul:1,
    bossIndex:0,timeBonus:0,enemyBuff:0,block:0,choice:'atk',locked:false,
    wrongWords:{},turnCount:0,enemiesInFloor:1,enemy:null,thorn:false,comboGold:false,knowBuff:false
  });
  S.atkMul=(HEROES[S.hero].atkMul||1)*(S.atkMul||1);
  S.maxHp=60+META.maxHp*8;S.hp=S.maxHp;
  $('atkRate').textContent='~'+Math.round(ATK_RATE*(S.atkMul||1))+'/秒';
  $('defRate').textContent='~'+DEF_RATE+'/秒';
  showScreen('game');$('log').innerHTML='';
  spawnFloor();updatePlayer();updateTop();
}
function endRun(win){
  clearInterval(S.timer);
  const star=Math.max(1,Math.floor(S.floor/2)+(win?8:0)+Math.floor(S.correctTotal/20));
  META.star+=star;saveMeta();
  showScreen('result');
  $('resultGlyph').setAttribute('data-lucide',win?'trophy':'skull');refreshIcons();
  $('resultTitle').textContent=win?'远征通关！':'远征失败';
  $('resultStats').innerHTML=
    '<div class="stat-row"><span>到达层数</span><span>第 '+S.floor+' 层</span></div>'+
    '<div class="stat-row"><span>答对 / 答错</span><span>'+S.correctTotal+' / '+S.wrongTotal+'</span></div>'+
    '<div class="stat-row"><span>击败敌人</span><span>'+S.killedTotal+'</span></div>'+
    '<div class="stat-row"><span>最高连击</span><span>×'+S.maxCombo+'</span></div>'+
    '<div class="stat-row"><span>获得金币</span><span>'+S.gold+'</span></div>'+
    '<div class="stat-row"><span>✨ 星尘</span><span>+'+star+'</span></div>';
}
function renderMeta(){
  $('metaStar').textContent='星尘: '+META.star;
  const list=$('upgradeList');list.innerHTML='';
  const ups=[
    {k:'maxHp',name:'❤ 生命强化',desc:'每级 +8 最大生命',cost:n=>6+n*3,lv:META.maxHp,max:8},
    {k:'goldStart',name:'🪙 开局金币',desc:'每级 +5 金币',cost:n=>8+n*4,lv:META.goldStart,max:5}
  ];
  ups.forEach(u=>{const cost=u.cost(u.lv);const d=document.createElement('div');d.className='upgrade';d.innerHTML='<div><div class="u-name">'+u.name+' <span style="color:var(--gold)">Lv.'+u.lv+'</span></div><div class="u-desc">'+u.desc+'</div></div><div class="u-cost">✨'+cost+'</div>';if(META.star<cost||u.lv>=u.max)d.disabled=true;d.onclick=()=>{if(META.star>=cost&&u.lv<u.max){META.star-=cost;META[u.k]++;saveMeta();renderMeta();}};list.appendChild(d);});
}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('screen-'+id).classList.add('active');if(id==='meta')renderMeta();refreshIcons();}
function init(){
  // ★ 双主题：极简线条 / 粉红可爱（localStorage 记忆）
  S.theme=localStorage.getItem('lexicon_theme')||'minimal';
  document.documentElement.setAttribute('data-theme',S.theme);
  document.querySelectorAll('#themeChips .chip').forEach(c=>{
    c.classList.toggle('selected',c.dataset.theme===S.theme);
    c.onclick=()=>{S.theme=c.dataset.theme;document.documentElement.setAttribute('data-theme',S.theme);localStorage.setItem('lexicon_theme',S.theme);document.querySelectorAll('#themeChips .chip').forEach(x=>x.classList.toggle('selected',x.dataset.theme===S.theme));};
  });
  const tc=$('tierChips');tc.innerHTML='<div class="chip selected">KET<span class="d">剑桥 A2 核心词</span></div>';S.tier='ket';
  const hc=$('heroChips');Object.keys(HEROES).forEach((h,i)=>{const c=document.createElement('div');c.className='chip'+(h==='warrior'?' selected':'');c.innerHTML=HEROES[h].name+'<span class="d">'+HEROES[h].desc+'</span>';c.onclick=()=>{S.hero=h;document.querySelectorAll('#heroChips .chip').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');};hc.appendChild(c);});S.hero='warrior';
  const dc=$('diffChips');Object.keys(DIFFS).forEach((d,i)=>{const c=document.createElement('div');c.className='chip'+(d==='normal'?' selected':'');c.innerHTML=DIFFS[d].name;c.onclick=()=>{S.diff=d;document.querySelectorAll('#diffChips .chip').forEach(x=>x.classList.remove('selected'));c.classList.add('selected');};dc.appendChild(c);});S.diff='normal';
  $('btnStart').onclick=()=>startRun();
  $('btnMeta').onclick=()=>showScreen('meta');
  $('btnMetaBack').onclick=()=>showScreen('start');
  $('btnAgain').onclick=()=>showScreen('start');
  $('btnHome').onclick=()=>showScreen('start');
  $('btnAtk').onclick=()=>choose('atk');
  $('btnDef').onclick=()=>choose('def');
  refreshIcons();
}
init();
</script>
</body>
</html>
