<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>词域远征 · 尖塔背单词</title>
<!-- 现代学术奇幻 · 字体：标题衬线 / 正文无衬线 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;600;700;900&family=Manrope:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lucide@latest/dist/umd/lucide.min.css">
<link rel="stylesheet" href="css/style.css?v=20260818e">
</head>
<body>
<div id="fxLayer"></div>

<!-- 悬浮：返回主页（战斗时显示） -->
<button id="btnHomeFloat" class="float-btn float-home hidden" data-sfx="button" title="返回主页"><i data-lucide="home"></i></button>
<!-- 悬浮：主题切换 -->
<button id="floatTheme" class="float-btn float-palette" data-sfx="button" title="切换主题"><i data-lucide="palette"></i></button>
<button id="btnSettings" class="float-btn float-gear" data-sfx="button" title="设置"><i data-lucide="settings"></i></button>
<div id="themePop" class="hidden">
  <div class="t-opt" data-theme="minimal">极简线条</div>
  <div class="t-opt" data-theme="pink">粉红可爱</div>
  <div class="t-opt" data-theme="mech">暗色机甲</div>
  <button id="btnMute" class="t-mute"><i data-lucide="volume-2"></i> 音效开启</button>
</div>
<div id="settingsPop" class="hidden">
  <div class="set-title">⚙ 设置</div>
  <div class="set-row"><span>音乐音量</span><input type="range" id="bgmVol" min="0" max="100" value="32"></div>
  <button class="btn ghost set-close" id="btnSettingsClose">关闭</button>
</div>
</div>

<div id="app">

  <!-- ============ 主菜单 ============ -->
  <main id="screen-start" class="screen active" aria-label="主菜单">
    <div class="home-hero">
      <div class="logo"><span class="glyph" data-lucide="scroll"></span></div>
      <h1 class="title">词域<em>远征</em></h1>
    </div>
    <section class="panel" aria-label="词库"><h3>词库</h3><div class="chips" id="tierChips"></div></section>
    <section class="panel" aria-label="角色"><h3>角色</h3><div class="chips" id="heroChips"></div></section>
    <section class="panel" aria-label="难度"><h3>难度</h3><div class="chips" id="diffChips"></div></section>
    <button class="btn gold hidden" id="btnContinue">⚔ 继续远征</button>
    <button class="btn gold" id="btnStart">开始远征</button>
    <button class="btn ghost" id="btnMeta">局外成长</button>
    <a class="btn ghost home-link" href="https://kiki-game.de5.net"><i data-lucide="house"></i> 返回游戏主页</a>
  </main>

  <!-- ============ 战斗 ============ -->
  <section id="screen-game" class="screen" aria-label="战斗">
    <!-- 顶栏：层数 / 生命 / 金币 / 连击 + 药水栏 -->
    <header id="topbar">
      <div class="top-stat-row">
        <div class="stat"><div class="v" id="statFloor">Lv.1</div><div class="l">层数</div></div>
        <div class="stat hpstat"><div class="v" id="statHp">60</div><div class="hpbar"><i id="statHpBar"></i></div><div class="l">生命</div></div>
        <div class="stat"><div class="v" id="statGold">0</div><div class="l">金币</div></div>
        <div class="stat"><div class="v" id="combo">×0</div><div class="l">连击</div></div>
      </div>
      <div id="potionBar" aria-label="药水栏"></div>
    </header>

    <!-- 遗物栏：实时显示已获取遗物 -->
    <div id="relicBar" aria-label="遗物栏"><span class="rbar-title">遗物</span><span class="rbar-empty">暂无</span></div>

    <!-- 战斗台：左右分屏（左玩家 / 右敌人），意图放敌人头顶 -->
    <section id="battleField" aria-label="战场">
      <!-- 左：玩家区（HP/格挡/本击 + 攻防按钮） -->
      <div id="playerArea" aria-label="玩家状态">
        <div class="pstats">
          <div class="pstat"><div class="lbl">生命</div><div class="num" id="pHp">60</div></div>
          <div class="pstat def"><div class="ico" data-lucide="shield"></div><div class="num" id="pBlock">0</div><div class="lbl">格挡</div></div>
          <div class="pstat atk"><div class="ico" data-lucide="swords"></div><div class="num" id="pAtk">×1</div><div class="lbl">本击</div></div>
        </div>
        <nav id="actionBar" aria-label="攻防选择">
          <div class="actionCard atk" id="btnAtk"><div class="ico" data-lucide="sword"></div><div class="nm">攻击</div><div class="ds">答对造成伤害</div><div class="rate" id="atkRate">0/秒</div></div>
          <div class="actionCard def" id="btnDef"><div class="ico" data-lucide="shield"></div><div class="nm">防御</div><div class="ds">答对获得格挡</div><div class="rate" id="defRate">0/秒</div></div>
        </nav>
      </div>

      <!-- 右：敌人区（意图在头顶 + 怪物 + 血条 + 格挡） -->
      <div id="enemyArea" aria-label="敌人">
        <div id="intentBox">
          <span id="intentIco" data-lucide="sword"></span>
          <span id="intentLabel">攻击</span>
          <span id="intentNum">8</span>
        </div>
        <span id="floorTag">第 1 层</span>
        <div id="enemyRow">
          <span id="enemyIcon"></span>
          <div id="enemyMeta">
            <div id="enemyName">史莱姆</div>
            <div id="enemyHpWrap"><div id="enemyHp"><i id="enemyHpFill"></i></div><div id="enemyHpTxt">30/30</div></div>
            <div id="enemyBlock"><span data-lucide="shield"></span><span id="enemyBlockNum">0</span></div>
          </div>
        </div>
      </div>
    </section>

    <footer id="logWrap" class="panel">
      <div id="logHeader" class="log-hd">⚔ 战斗日志 <span id="logArrow">▸</span></div>
      <div id="log" aria-label="战斗日志"></div>
    </footer>
  </section>

  <!-- ============ 结算 ============ -->
  <section id="screen-result" class="screen" aria-label="结算">
    <div class="panel" style="margin-top:24px;">
      <div class="logo"><span class="glyph" id="resultGlyph" data-lucide="skull"></span></div>
      <div class="big-result" id="resultTitle">远征失败</div>
      <div id="resultStats"></div>
      <button class="btn gold" id="btnAgain" style="margin-top:14px;">再次远征</button>
      <button class="btn ghost" id="btnHome">返回主页</button>
    </div>
  </section>

  <!-- ============ 局外成长 ============ -->
  <section id="screen-meta" class="screen" aria-label="局外成长">
    <div class="panel" style="margin-top:20px;">
      <h3 style="text-align:center;font-size:17px;">局外成长</h3>
      <div class="meta-star-wrap" id="metaStar"><span class="star-ico"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.2l1.3-6.6L2.5 9l6.6-.8z"/></svg></span><span id="metaStarNum">0</span></div>
      <div class="upgrade-list" id="upgradeList"></div>
      <button class="btn ghost" id="btnMetaBack">返回</button>
    </div>
  </section>
</div>

<!-- 答题弹窗（攻击/防御 → 弹出答题） -->
<div id="quizOverlay">
  <div class="quiz-card">
    <section id="qArea" aria-label="答题">
      <span id="qType">英→中</span>
      <span id="timerRing">15</span>
      <div id="choiceBanner" class="atk">攻击</div>
      <div id="qWord">abandon</div>
      <div id="qPos">v.</div>
      <div id="qHint">选择正确释义</div>
      <div id="options"></div>
      <div id="feedback"></div>
    </section>
  </div>
</div>

<!-- 遗物三选一弹窗 -->
<div id="overlay"><div class="overlay-card"><div class="oc-title">遗物</div><div class="oc-sub">三选一强化本局</div><div class="relics" id="relicChoices"></div></div></div>

<!-- 统一悬浮弹窗（遗物/药水 tooltip） -->
<div id="tooltip" class="hidden" role="tooltip"></div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://unpkg.com/tone@15/build/Tone.js"></script>
<script>window.addEventListener("load",function(){if(!window.Tone){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js";document.head.appendChild(s);setTimeout(function(){if(window.Tone&&typeof playMusic==="function"&&typeof ensureMusic==="function")ensureMusic();},900);}});</script>
<script src="js/data.js?v=20260818e"></script>
<script src="js/game.js?v=20260818e"></script>
<script src="js/main.js?v=20260818e"></script>
</body>
</html>
